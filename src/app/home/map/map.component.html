<div class="container font-kadwa px-4 md:px-0 overflow-x-hidden">
  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-3">
      <span class="w-3 h-8 bg-[#1F3D2B] rounded-full inline-block"></span>
      <span class="font-bold text-2xl text-[#1F3D2B] block">
        რუკით ძიება
      </span>
    </div>
    @if (isDataReady) {
      <button 
        (click)="resetMapView()" 
        class="text-xs font-semibold text-[#1F3D2B] bg-[#1F3D2B]/10 hover:bg-[#1F3D2B]/20 transition px-3 py-1.5 rounded-lg flex items-center gap-1">
        🔄 ხედვის გადატვირთვა
      </button>
    }
  </div>

  @if (isDataReady) {
    <div class="relative shadow-md rounded-2xl overflow-hidden mb-12 border border-gray-100">
      <div
        #mapContainer
        id="map"
        class="w-full h-[450px] md:h-[550px] max-w-full z-0">
      </div>
    </div>
  } @else {
    <div class="w-full h-[450px] md:h-[550px] max-w-full rounded-2xl overflow-hidden mb-12 flex flex-col items-center justify-center bg-gray-50 border border-gray-200 text-gray-500 gap-3 shadow-inner">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-[#1F3D2B]"></div>
      <p class="text-sm font-medium">რუკა და მონაცემები იტვირთება...</p>
    </div>
  }
</div>
