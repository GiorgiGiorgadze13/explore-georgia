<app-header></app-header>

<div class="container mx-auto px-4 sm:px-6 lg:px-8 font-kadwa">
  <div class="my-6 lg:my-12 flex flex-col lg:flex-row justify-between items-stretch gap-8 lg:gap-12">
    
    <!-- LEFT: Hero Image Banner -->
    <div class="relative overflow-hidden rounded-2xl w-full lg:w-1/2 min-h-[350px] sm:min-h-[420px] lg:min-h-full flex flex-col justify-end p-6 sm:p-10">
      <!-- Background Image -->
      <img src="/landscape.png" alt="landscape" class="absolute inset-0 w-full h-full object-cover">
      
      <!-- Gradient Overlay -->
      <div class="absolute inset-0 bg-gradient-to-t from-[#012D1D]/90 via-[#012D1D]/30 to-transparent"></div>

      <!-- Content Stack (Clean positioning without rigid fixed coordinates) -->
      <div class="relative z-10 flex flex-col gap-3">
        <h2 class="text-[#FCF9F8] text-3xl sm:text-4xl lg:text-5xl font-bold leading-tight">
          Discover Georgia
        </h2>
        <p class="text-[#FFFFFFE5] text-sm sm:text-base lg:text-lg max-w-lg">
          დაიწყეთ თქვენი მოგზაურობა. აღმოაჩინეთ უნიკალური ადგილები, კულტურა და ტრადიციები.
        </p>
      </div>
    </div>

    <!-- RIGHT: Auth Card -->
    <div class="w-full lg:w-1/2 max-w-md mx-auto lg:mx-0 bg-[#1B433205] border border-[#C1C8C24D] shadow-[0_4px_20px_0_#1B433205] px-5 py-6 sm:px-8 sm:py-8 rounded-2xl flex flex-col justify-between">
      <div>
        <!-- Header -->
        <div class="text-center mb-6">
          <h3 class="text-[#1B1C1C] text-2xl sm:text-3xl font-bold mb-2">პაროლის აღდგენა</h3>
         </div>

        <!-- Form Inputs -->
        <div class="mt-6 flex flex-col gap-4">
          <div>
            <label class="block text-sm sm:text-base font-medium mb-1">ელფოსტა / მობილური</label>
            <input type="text" placeholder="g@gmail.com" class="w-full py-3 px-4 border border-[#00000017] rounded-lg focus:outline-none focus:border-[#1B4332]">
          </div>

          
        </div>

       <button class="mt-4 text-[#000000]">კოდის გაგზავნა </button>
        <div class="mt-8 flex justify-center">
          <button routerLink="/recoverCode" class="w-full sm:w-auto flex justify-center items-center gap-2 bg-[#1B4332] hover:bg-[#143326] transition-colors py-3.5 px-12 rounded-2xl text-white font-medium">
            <span>დადასტურება</span> 
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9.13125 6.75H0V5.25H9.13125L4.93125 1.05L6 0L12 6L6 12L4.93125 10.95L9.13125 6.75Z" fill="white"/>
            </svg>
          </button>
        </div>
      </div>

     
    </div>

  </div>
</div>

<app-footer></app-footer>
